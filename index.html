<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF9A8B">
  <title>家庭赚¥指南</title>
  <link rel="stylesheet" href="css/style.css?v=20260817c">
</head>
<body>

<div id="app">

  <!-- ========== 顶部标题栏 ========== -->
  <header class="app-header">
    <h1 class="app-title">🏠 家庭赚¥指南</h1>
    <button class="header-btn" id="menuBtn" title="更多">⋯</button>
  </header>

  <!-- ========== 下拉菜单 ========== -->
  <div class="dropdown-menu" id="dropdownMenu">
    <button class="dropdown-item" id="exportBtn">📥 导出数据</button>
    <button class="dropdown-item" id="importBtn">📤 导入数据</button>
    <button class="dropdown-item" id="loadSampleBtn">✨ 加载示例数据</button>
    <button class="dropdown-item danger" id="clearBtn">🗑️ 清空所有数据</button>
  </div>

  <!-- ========== 成员横向选择栏 ========== -->
  <div class="member-bar" id="memberBar">
    <div class="member-bar-scroll" id="memberBarScroll">
      <!-- JS动态生成 -->
    </div>
  </div>

  <!-- ========== 主内容区 ========== -->
  <main class="main-content" id="mainContent">

    <!-- ===== 首页（打卡） ===== -->
    <div class="content-view active" id="view-home">
      <!-- 问候语 -->
      <div class="greeting-section" id="greetingSection">
        <div class="greeting-left">
          <div class="greeting-title" id="greetingTitle">早上好呀！☀️</div>
          <div class="greeting-subtitle" id="greetingSubtitle">今天也要加油赚零花钱呀 ✨</div>
        </div>
        <div class="greeting-right">
          <div class="greeting-date" id="greetingDate">📅 08/05</div>
          <div class="mascot" id="greetingMascot">🐰</div>
        </div>
      </div>

      <!-- 连续打卡条 -->
      <div id="streakBar" class="streak-bar" style="display:none"></div>

      <!-- 概览卡片 -->
      <div class="overview-cards" id="overviewCards">
        <!-- JS动态生成 -->
      </div>

      <!-- 🌟 心愿进度 -->
      <div class="wish-home-progress" id="homeWishProgress">
        <div class="wish-home-empty">还没有设置心愿，去 <a href="#" class="wish-home-link">🌟 心愿</a> 添加吧</div>
      </div>

      <!-- 快速自定义任务 -->
      <div class="custom-task-bar">
        <input type="text" class="form-input" id="homeQuickTaskName" placeholder="新建任务..." maxlength="15">
        <div class="amount-input-group">
          <span class="amount-prefix">¥</span>
          <input type="number" class="form-input amount-input" id="homeQuickTaskAmount" value="1" min="0.1" max="999" step="0.1">
        </div>
        <button class="btn-add-quick" id="homeQuickEarnBtn">💰</button>
        <button class="btn-add-quick penalty" id="homeQuickPenaltyBtn">⚠️</button>
      </div>

      <!-- 基础零花钱 -->
      <div class="section-header basic-section-toggle" id="basicSectionHeader">
        <h2><span class="collapse-arrow" id="basicCollapseArrow">▼</span> 💵 基础零花钱</h2>
        <span class="section-badge" id="basicProgress">0/0</span>
      </div>
      <div class="basic-task-list" id="homeBasicTasks"></div>
      <button class="btn-preview-claim" id="btnPreviewClaim">🎬 预览到账动画</button>

      <!-- 赚钱任务 -->
      <div class="section-header" style="margin-top:12px">
        <h2>💰 赚钱项目</h2>
      </div>
      <div class="task-grid" id="homeEarnTasks"></div>

      <!-- 扣款项目 -->
      <div class="section-header" style="margin-top:16px">
        <h2>⚠️ 扣款项目</h2>
      </div>
      <div class="task-grid" id="homePenaltyTasks"></div>

      <!-- 今日动态 -->
      <div class="section-header" style="margin-top:16px">
        <h2>📋 今日动态</h2>
      </div>
      <div class="today-feed" id="homeTodayFeed"></div>
    </div>

    <!-- ===== 记录页 ===== -->
    <div class="content-view" id="view-records">
      <div class="section-header">
        <h2>📝 收支记录</h2>
      </div>
      <div class="filter-bar">
        <select class="filter-select" id="filterMember">
          <option value="">全部成员</option>
        </select>
        <select class="filter-select" id="filterType">
          <option value="">全部类型</option>
          <option value="earn">💰 赚钱</option>
          <option value="penalty">📉 扣款</option>
          <option value="redeem">🎁 兑换</option>
          <option value="wish">🌟 心愿</option>
        </select>
        <select class="filter-select" id="filterTask">
          <option value="">全部任务</option>
        </select>
      </div>
      <div class="record-list" id="recordList"></div>
    </div>

    <!-- ===== 排行页 ===== -->
    <div class="content-view" id="view-ranking">
      <div class="sub-tabs">
        <button class="sub-tab active" data-subtab="ranking">🏆 排行榜</button>
        <button class="sub-tab" data-subtab="income">💰 收入</button>
      </div>
      <div class="sub-page active" id="subpage-ranking">
        <div class="ranking-list" id="rankingList"></div>
      </div>
      <div class="sub-page" id="subpage-income">
        <div class="income-period-tabs" id="incomePeriodTabs">
          <button class="income-period-tab active" data-period="week">📅 本周</button>
          <button class="income-period-tab" data-period="month">📆 本月</button>
          <button class="income-period-tab" data-period="year">📊 本年</button>
        </div>
        <div class="income-content" id="incomeContent"></div>
      </div>
    </div>

    <!-- ===== 奖励页（奖励商店 + 心愿） ===== -->
    <div class="content-view" id="view-rewards">
      <div class="section-header">
        <h2>🎁 奖励商店</h2>
        <button class="btn-add" data-action="add-reward">＋</button>
      </div>
      <div class="reward-list" id="rewardList"></div>

      <div class="section-header" style="margin-top:20px">
        <h2>🌟 我的心愿</h2>
        <button class="btn-add" data-action="add-wish">＋</button>
      </div>
      <div class="wish-list" id="wishList"></div>

      <div class="section-header" style="margin-top:20px">
        <h2>🎉 已达成心愿</h2>
      </div>
      <div class="wish-achieved-list" id="wishAchievedList"></div>

      <!-- 成就墙 -->
      <div class="section-header" style="margin-top:20px">
        <h2>🏅 成就墙</h2>
      </div>
      <div class="achievement-wall" id="achievementWall">
        <!-- JS动态生成 -->
      </div>
    </div>

    <!-- ===== 我的页 ===== -->
    <div class="content-view" id="view-profile">
      <!-- 成员管理 -->
      <div class="section-header">
        <h2>👥 成员管理</h2>
        <button class="btn-add" data-action="add-member">＋</button>
      </div>
      <div class="profile-list" id="profileMemberList"></div>

      <!-- 任务管理 -->
      <div class="section-header" style="margin-top:20px">
        <h2>⚙️ 任务管理</h2>
        <button class="btn-add" data-action="add-task">＋</button>
      </div>
      <div class="custom-task-bar" style="margin-bottom:12px">
        <input type="text" class="form-input" id="quickTaskName" placeholder="快速添加任务..." maxlength="15">
        <div class="amount-input-group">
          <span class="amount-prefix">¥</span>
          <input type="number" class="form-input amount-input" id="quickTaskAmount" value="1" min="0.1" max="999" step="0.1">
        </div>
        <button class="btn-add-quick" id="quickAddEarnBtn">💰</button>
        <button class="btn-add-quick penalty" id="quickAddPenaltyBtn">⚠️</button>
      </div>
      <div class="profile-list" id="profileTaskList"></div>

      <!-- 基础零花钱 -->
      <div class="section-header" style="margin-top:20px">
        <h2>💵 基础零花钱任务</h2>
        <button class="btn-add" data-action="add-basic-task">＋</button>
      </div>
      <div class="profile-list" id="profileBasicList"></div>

      <!-- 设置 -->
      <div class="section-header" style="margin-top:20px">
        <h2>⚙️ 设置</h2>
      </div>
      <div class="profile-list" id="profileSettings">
        <div class="profile-item" id="weeklyBaseSetting">
          <div class="profile-item-icon">💵</div>
          <div class="profile-item-info">
            <div class="profile-item-name">每周基础零花钱</div>
            <div class="profile-item-meta" id="weeklyBaseDisplay">¥10 / 周</div>
          </div>
          <button class="icon-btn" id="editWeeklyBase">✏️</button>
        </div>
        <div class="profile-item" id="clearCacheBtn">
          <div class="profile-item-icon">🗑️</div>
          <div class="profile-item-info">
            <div class="profile-item-name">清除全部缓存</div>
            <div class="profile-item-meta">重置所有数据用于测试</div>
          </div>
          <button class="icon-btn" id="btnClearCache">🧹</button>
        </div>
      </div>
    </div>

  </main>

  <!-- ========== 底部 TabBar ========== -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar-item active" data-view="home">
      <span class="tabbar-icon">🏠</span>
      <span class="tabbar-label">首页</span>
    </button>
    <button class="tabbar-item" data-view="records">
      <span class="tabbar-icon">📝</span>
      <span class="tabbar-label">记录</span>
    </button>
    <button class="tabbar-item" data-view="ranking">
      <span class="tabbar-icon">🏆</span>
      <span class="tabbar-label">排行</span>
    </button>
    <button class="tabbar-item" data-view="rewards">
      <span class="tabbar-icon">🎁</span>
      <span class="tabbar-label">奖励</span>
    </button>
    <button class="tabbar-item" data-view="profile">
      <span class="tabbar-icon">👤</span>
      <span class="tabbar-label">我的</span>
    </button>
  </nav>

</div>

<!-- ========== 弹窗：通用表单 ========== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContainer">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ========== 成就通知 ========== -->
<div class="achievement-toast-overlay" id="achievementToast"></div>

<!-- ========== 基础零花钱到账通知 ========== -->
<div class="basic-claim-toast-overlay" id="basicClaimToast"></div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast"></div>

<!-- ========== 确认弹窗 ========== -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal modal-confirm" id="confirmContainer">
    <div class="modal-body">
      <p id="confirmMessage">确认操作？</p>
      <div class="confirm-actions">
        <button class="btn btn-cancel" id="confirmCancel">取消</button>
        <button class="btn btn-danger" id="confirmOk">确认</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

<script src="js/store.js?v=20260817c"></script>
<script src="js/app.js?v=20260817c"></script>
</body>
</html>
